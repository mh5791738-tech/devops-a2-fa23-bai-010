name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check the page
        run: |
          test -f index.html
          test -f style.css
          grep -q '<title>' index.html
          grep -q 'fa23-bai-010' index.html
          grep -q 'stylesheet' index.html
          grep -q 'Skills' index.html
          if grep -q '{{' index.html; then echo "Unfilled placeholder in index.html"; exit 1; fi
          echo "Page checks passed"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-a2:latest
